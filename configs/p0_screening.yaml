seed: 42
dataset:
  name: pubtables1m
  annotations: data/raw/pubtables/PubTables-1M-Image_Page_Detection_PASCAL_VOC
  split_file: data/raw/pubtables/PubTables-1M-Image_Page_Detection_PASCAL_VOC/val_filelist.txt
  image_root: data/raw/pubtables/PubTables-1M-Image_Page_Detection_PASCAL_VOC/images
  pdf_root: data/raw/pubtables/pdfs
  split: validation
  sample_size: 300
  document_level_sampling: true
  require_source_pdf: true
parsers:
  - name: pymupdf
    role: cheap
    options:
      detect_tables: true
  - name: docling
    role: strong
    options: {}
benchmark:
  warmup: 2
  power_interval_seconds: 0.5
cache:
  root: cache/parsers
outputs:
  root: outputs/p0
