seed: 42
dataset:
  name: pubtables1m
  annotations: data/raw/pubtables/PubTables-1M-Image_Page_Detection_PASCAL_VOC
  split_file: data/raw/pubtables/PubTables-1M-Image_Page_Detection_PASCAL_VOC/preflight_filelist.txt
  image_root: data/raw/pubtables/PubTables-1M-Image_Page_Detection_PASCAL_VOC/images
  pdf_root: data/raw/pubtables/pdfs
  split: p1_repair
  sample_size: 300
  document_level_sampling: true
  require_source_pdf: true
  exclude_document_ids:
    - PMC6067716
parsers:
  - name: pymupdf_union_refine
    role: cheap
    options:
      detect_tables: true
      table_settings:
        vertical_strategy: lines
        horizontal_strategy: lines
        use_layout: true
        union: true
        refine: true
  - name: pymupdf_text
    role: cheap
    options:
      detect_tables: true
      table_settings:
        vertical_strategy: text
        horizontal_strategy: text
        use_layout: false
  - name: pymupdf_lines_raw
    role: cheap
    options:
      detect_tables: true
      table_settings:
        vertical_strategy: lines
        horizontal_strategy: lines
        use_layout: false
benchmark:
  warmup: 2
  power_interval_seconds: 0.1
cache:
  root: cache/parsers
outputs:
  root: outputs/p1_repair
