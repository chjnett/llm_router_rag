[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caproute-rag"
version = "0.1.0"
description = "Capability-aware selective document processing for scientific PDF RAG"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6.0", "PyMuPDF>=1.24"]

[project.optional-dependencies]
strong = ["docling>=2.0"]
gpu = ["torch>=2.4"]
dev = ["pytest>=8.0"]
lightweight = ["pdfplumber>=0.11,<0.12"]
learned = ["transformers>=4.46,<5", "torch>=2.4", "torchvision>=0.19", "timm>=1.0,<2"]

[project.scripts]
caproute-screen = "caproute.cli.screen:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
